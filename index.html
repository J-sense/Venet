<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VNET</title>
    <style>
      /* Initial loader styles to show before React boots up */
      body, html {
        margin: 0;
        padding: 0;
        background-color: #0A0A0A;
      }
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0A0A0A;
        z-index: 99999;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(11, 96, 189, 0.15);
        border-top: 4px solid #007AFF;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- This HTML is rendered instantly by the browser, and gets replaced by React once the app bundle is loaded -->
      <div id="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
